seed: 42

gnn:
  epochs: 30
  batch_size: 4096
  lr: 1.0e-3
  weight_decay: 1.0e-5
  num_neg_samples: 5
  loss: weighted_bpr
  early_stopping_patience: 5
  # 무작위 음성 중 "학습 간선이 있는 노드(warm)" 에서 뽑는 비율. 0.0 = 전체 노드에서 균등 추출.
  # 양성 기업은 항상 warm 인데 기업의 약 95% 는 간선이 없어서, 0.0 이면 모델이 warm/cold 구분만으로
  # 손실을 낮출 수 있다.
  warm_neg_ratio: 0.0
  # 배치의 양성 쌍을 그 스텝의 메시지 전파 간선에서 제외할지 여부.
  # 끄면 점수를 매기는 쌍이 인코딩 때 직접 이웃으로도 주어진다.
  mask_batch_edges: false
  # 학습 프로세스의 GPU 메모리 상한(장치 메모리 대비 비율). null 이면 제한 없음.
  # GB10 은 통합 메모리라, 제한이 없으면 할당기 캐시가 시스템 메모리를 모두 차지할 수 있다.
  gpu_memory_fraction: 0.6
  # 미니배치 학습(이웃 샘플링). 전체 그래프 학습이 메모리에 들어가지 않는 인코더(HGT)에 쓴다.
  # 켜면 스텝마다 배치의 양성·음성 노드와 그 표본 이웃만 인코딩한다 (sage / gat / hgt 지원).
  minibatch:
    enabled: false
    fanouts: [10, 5]        # 배치 노드에서 1홉, 2홉 순으로 노드·관계당 남기는 유입 간선 수 (층 수와 같아야 함)
    batch_size: 1024        # 미니배치 학습 때의 양성 쌍 배치 크기 (--batch-size 가 우선)
    eval_chunk_nodes: 50000 # 전체 임베딩 계산 때 한 번에 처리하는 대상 노드 수 (결과는 전체 계산과 동일)
    # 남길 유입 간선 선택: random = 에폭마다 무작위 (임베딩은 전체 이웃으로 계산),
    # top_score = 간선 점수 상위 고정 (학습과 임베딩 계산에 같은 이웃을 사용).
    # 점수는 키워드·상속 간선은 캐시의 score, 그 밖의 관계는 양 끝 노드 피처의 코사인 유사도.
    neighbor_selection: random
    eval_seed_nodes: 20000  # top_score 임베딩 계산 때 한 번에 인코딩하는 타입별 노드 수
  # held_out split은 graph.yaml에서 관리 (빌드 시점에 그래프 아티팩트와 함께 고정)

projection_mlp:
  epochs: 50
  batch_size: 8192
  lr: 1.0e-3
  weight_decay: 1.0e-6

eval:
  k: 100
  metrics: [hits, ndcg, recall]   # 각각 @10, @100 으로 보고

serving:
  topk: 100
  faiss_metric: inner_product
